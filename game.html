// ====================== 2. 遊戲引擎（你的判定規則，原樣移植） ======================
class MythGameEngine {
  /** 為當前波次生成 2 或 3 個神祇門扉：必含 1 個正解，其餘優先取混淆名單，不足則隨機補齊 */
  static generateGates(currentMonster, gateCount = 3) {
    const correctDeityId = currentMonster.rulingDeityId;
    const selectedDeityIds = [correctDeityId];

    for (const distractorId of currentMonster.confusionDeityIds) {
      if (selectedDeityIds.length >= gateCount) break;
      if (!selectedDeityIds.includes(distractorId)) selectedDeityIds.push(distractorId);
    }

    const allDeityIds = Object.keys(DEITIES);
    while (selectedDeityIds.length < gateCount) {
      const randomDeity = allDeityIds[Math.floor(Math.random() * allDeityIds.length)];
      if (!selectedDeityIds.includes(randomDeity)) selectedDeityIds.push(randomDeity);
    }

    // Fisher-Yates 洗牌：正解門隨機分佈於左中右
    for (let i = selectedDeityIds.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [selectedDeityIds[i], selectedDeityIds[j]] = [selectedDeityIds[j], selectedDeityIds[i]];
    }

    return selectedDeityIds.map((id, index) => ({
      gateIndex: index,
      deity: DEITIES[id],
      isCorrect: id === correctDeityId
    }));
  }

  /** 判定核心：玩家撞門/選門後的結算處理 */
  static resolveSelection(chosenDeityId, monster) {
    const isSuccess = chosenDeityId === monster.rulingDeityId;
    const chosenDeity = DEITIES[chosenDeityId];
    const correctDeity = DEITIES[monster.rulingDeityId];

    if (isSuccess) {
      return {
        success: true, chosenDeity, correctDeity,
        appliedBuff: {
          damageMultiplier: chosenDeity.bulletModifier.damageMultiplier,
          bulletEffect: chosenDeity.bulletModifier.specialEffect
        },
        feedbackMessage: `【神力共鳴】獲取 ${chosenDeity.name} 的「${chosenDeity.weaponName}」，對此領域怪物造成屬性壓制！`,
        analyticsPayload: { monsterId: monster.id, chosenDeityId, correctDeityId: monster.rulingDeityId, isMisconception: false }
      };
    }

    const isMisconception = monster.confusionDeityIds.includes(chosenDeityId);
    const customLine = REBUKE_DIALOGUES[chosenDeityId]?.[monster.rulingDeityId];
    const feedbackMessage = customLine ||
      `❌ ${chosenDeity.name} 的領域為「${chosenDeity.domain}」。面對「${monster.name}」，應尋求掌管「${correctDeity.domain}」的 ${correctDeity.name}！`;

    return {
      success: false, chosenDeity, correctDeity,
      appliedBuff: { damageMultiplier: 0.5, bulletEffect: 'none' }, // 懲罰：火力削弱 50%
      feedbackMessage,
      analyticsPayload: { monsterId: monster.id, chosenDeityId, correctDeityId: monster.rulingDeityId, isMisconception }
    };
  }
}

// ====================== 4. 基礎設定 ======================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * DPR; canvas.height = H * DPR;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  const wrap = document.getElementById('wrap');
  wrap.style.width = (W * s) + 'px';
  wrap.style.height = (H * s) + 'px';
  document.getElementById('ui').style.fontSize = (14 * s) + 'px';
}
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, size, color, align = 'center', bold = false, base = 'middle') {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(s, x, y);
}
function wrapLines(text, maxW, font) {
  ctx.font = font;
  const lines = []; let cur = '';
  for (const ch of text) {
    if (ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ====================== 5. 音效（WebAudio，無外部檔案） ======================
let actx = null, muted = false;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.07, endFreq = null, delay = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  blessing() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.25, 'triangle', 0.08, null, i * 0.07)); },
  error() { beep(130, 0.35, 'sawtooth', 0.09, 70); },
  hit() { beep(300, 0.05, 'square', 0.025, 180); },
  hurt() { beep(220, 0.3, 'sawtooth', 0.1, 60); },
  shield() { beep(700, 0.2, 'sine', 0.08, 300); },
  kill() { [392, 523, 659, 784, 1047].forEach((f, i) => beep(f, 0.3, 'triangle', 0.08, null, i * 0.09)); },
  start() { beep(440, 0.15, 'triangle', 0.07); beep(660, 0.25, 'triangle', 0.07, null, 0.12); }
};

// ====================== 6. 遊戲狀態 ======================
let phase = 'title';       // title | intro | fight | kill | over | win
let phaseT = 0, overT = 0, time = 0, paused = false;
let order = [], waveIdx = 0, monster = null;
let player = { x: W / 2, inv: 0, shield: 0, shieldCd: 0 };
let bullets = [], orbs = [], particles = [], floaters = [], bolts = [], rings = [];
let gateRow = null, gateTimer = 0;
let buff, score, lives, shake = 0, msg = null, fireT = 0;
let stats;
let targetX = null;
const keys = { left: false, right: false };

const stars = Array.from({ length: 70 }, () => ({ x: rand(0, W), y: rand(0, H), s: rand(0.6, 2), v: rand(8, 28), p: rand(0, 6.28) }));

function defaultBuff() {
  return { mult: 1, effect: 'none', key: 'bullet_default', name: '凡鐵箭', speedMult: 1, color: BULLET_STYLE.bullet_default.color };
}
function newGame() {
  order = [...MONSTER_ROSTER].sort(() => Math.random() - 0.5);
  score = 0; lives = 3; shake = 0; msg = null;
  player = { x: W / 2, inv: 0, shield: 0, shieldCd: 0 };
  bullets = []; orbs = []; particles = []; floaters = []; bolts = []; rings = [];
  stats = { right: 0, wrong: 0, mis: 0, mastered: {}, review: {}, pairs: {}, encounters: [], runTime: 0, startWall: Date.now(), submitted: false, bonus: 0 };
  hideEndPanel();
  startWave(0);
}
function startWave(i) {
  waveIdx = i;
  const def = order[i];
  monster = { def, hp: def.baseHp, maxHp: def.baseHp, x: W / 2, y: MONSTER_Y, flash: 0, melt: 0, shootT: 1.5, shots: 0, t: 0, rewarded: false };
  stats.encounters.push({ monsterId: def.id, outcome: 'fighting', right: 0, wrong: 0, chosen: [] });
  buff = defaultBuff();
  player.shield = 0; player.shieldCd = 0;
  gateRow = null; gateTimer = 1.0;
  bullets = []; orbs = [];
  phase = 'intro'; phaseT = 2.2;
  showMsg(`第 ${i + 1} 波：${def.name} 現身！威脅領域「${def.domainCategory}」——選擇正確的神祇之門！`, '#ffd86b', 4.2);
}
function showMsg(text, color, dur = 4.5) { msg = { text, color, t: 0, dur }; }

// ====================== 7. 選門碰撞回調（對應你的 handlePlayerGateCollision） ======================
function onGateCollision(gateEntity) {
  const result = MythGameEngine.resolveSelection(gateEntity.deity.id, monster.def);
  const cd = result.chosenDeity;

  if (result.success) {
    sfx.blessing();
    const bm = cd.bulletModifier;
    buff = {
      mult: result.appliedBuff.damageMultiplier,
      effect: result.appliedBuff.bulletEffect,
      key: bm.projectileVisualKey, name: cd.weaponName,
      speedMult: bm.speedMultiplier, color: BULLET_STYLE[bm.projectileVisualKey].color
    };
    if (buff.effect === 'shield') { player.shield = 1; player.shieldCd = 0; }
    // 每隻怪只有「第一次選對」才給分，避免重複刷神門
    if (!monster.rewarded) { monster.rewarded = true; score += 300; floatText(player.x, PLAYER_Y - 40, '+300', '#7dff9a'); }
    showMsg(result.feedbackMessage, '#00ff66', 4.5);
    burst(player.x, PLAYER_Y, buff.color, 40, 260);
    rings.push({ x: player.x, y: PLAYER_Y, r: 10, max: 120, life: 0.6, t: 0, color: buff.color });
  } else {
    sfx.error();
    shake = 0.35;
    buff = {
      mult: result.appliedBuff.damageMultiplier, effect: 'none', key: 'bullet_default',
      name: '凡鐵箭（火力削弱）', speedMult: 1, color: BULLET_STYLE.bullet_default.color
    };
    player.shield = 0;
    showMsg(result.feedbackMessage, '#ff4444', 5.5);
    burst(player.x, PLAYER_Y, '#ff4444', 24, 200);
  }
  track(result.analyticsPayload);
  return result.success;
}

// 學習數據
function track(p) {
  const enc = stats.encounters[stats.encounters.length - 1];
  if (enc) {
    if (p.chosenDeityId === p.correctDeityId) enc.right++;
    else { enc.wrong++; enc.chosen.push(p.chosenDeityId); }
  }
  if (p.chosenDeityId === p.correctDeityId) {
    stats.right++;
    stats.mastered[p.correctDeityId] = (stats.mastered[p.correctDeityId] || 0) + 1;
  } else {
    stats.wrong++;
    if (p.isMisconception) stats.mis++;
    stats.review[p.correctDeityId] = (stats.review[p.correctDeityId] || 0) + 1;
    const k = p.monsterId + '|' + p.chosenDeityId;
    stats.pairs[k] = (stats.pairs[k] || 0) + 1;
  }
}

// ====================== 8. 特效工具 ======================
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(speed * 0.2, speed);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), max: 0.9, color, size: rand(2, 4.5) });
  }
}
function floatText(x, y, text, color) { floaters.push({ x, y, text, color, life: 0.6 }); }
function makeBolt(x1, y1, x2, y2, color) {
  const pts = [[x1, y1]]; const n = 6;
  for (let i = 1; i < n; i++) pts.push([x1 + (x2 - x1) * i / n + rand(-14, 14), y1 + (y2 - y1) * i / n + rand(-14, 14)]);
  pts.push([x2, y2]);
  bolts.push({ pts, life: 0.25, color });
}

// ====================== 9. 傷害與玩家受傷 ======================
function dealDamage(raw, hx, hy) {
  let d = raw;
  if (monster.melt > 0) d *= 1.3;
  monster.hp -= d; monster.flash = 0.08;
  score += Math.round(d / 5);
  floatText(hx + rand(-10, 10), hy - 12, Math.round(d), monster.melt > 0 ? '#ff9a4a' : '#ffffff');
}
function hurtPlayer() {
  if (player.inv > 0) return;
  if (player.shield > 0) {
    player.shield = 0; player.shieldCd = 6; player.inv = 0.6; sfx.shield();
    burst(player.x, PLAYER_Y, '#f1d27a', 18, 180);
    return;
  }
  lives--; player.inv = 1.6; shake = 0.3; sfx.hurt();
  burst(player.x, PLAYER_Y, '#ff6a6a', 26, 240);
  if (lives <= 0) endRun(false);
}

// ====================== 10. 更新 ======================
function update(dt) {
  time += dt;
  stars.forEach(s => { s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = rand(0, W); } });
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= 40 * dt; f.life -= dt; });
  floaters = floaters.filter(f => f.life > 0);
  bolts.forEach(b => b.life -= dt); bolts = bolts.filter(b => b.life > 0);
  rings.forEach(r => { r.t += dt; r.r = r.max * Math.min(1, r.t / r.life); }); rings = rings.filter(r => r.t < r.life);
  if (shake > 0) shake -= dt;
  if (msg) { msg.t += dt; if (msg.t > msg.dur) msg = null; }

  if (phase === 'title') return;
  if (phase === 'over' || phase === 'win') { overT += dt; return; }

  // 玩家移動
  let dir = 0;
  if (keys.left) dir -= 1;
  if (keys.right) dir += 1;
  if (dir) { player.x += dir * 430 * dt; targetX = null; }
  else if (targetX != null) {
    const d = targetX - player.x, st = 640 * dt;
    player.x += Math.abs(d) < st ? d : Math.sign(d) * st;
  }
  player.x = clamp(player.x, 24, W - 24);
  if (player.inv > 0) player.inv -= dt;
  if (buff.effect === 'shield' && player.shield === 0 && player.shieldCd > 0) {
    player.shieldCd -= dt;
    if (player.shieldCd <= 0) player.shield = 1;
  }

  monster.t += dt;
  monster.x = W / 2 + Math.sin(monster.t * 0.8) * 110;
  monster.y = MONSTER_Y + Math.sin(monster.t * 1.7) * 6;
  if (monster.flash > 0) monster.flash -= dt;
  if (monster.melt > 0) monster.melt -= dt;

  if (phase === 'intro') {
    phaseT -= dt;
    if (phaseT <= 0) phase = 'fight';
    return;
  }
  if (phase === 'kill') {
    phaseT -= dt;
    if (phaseT <= 0) {
      if (waveIdx + 1 >= order.length) endRun(true);
      else startWave(waveIdx + 1);
    }
    updateBullets(dt);
    return;
  }

  // ---- fight ----
  stats.runTime += dt;
  // 自動射擊
  fireT -= dt;
  if (fireT <= 0) {
    fireT = FIRE_INTERVAL;
    bullets.push({
      x: player.x, y: PLAYER_Y - 22, vx: 0, vy: -BASE_BULLET_SPEED * buff.speedMult,
      dmg: BASE_DMG * buff.mult, key: buff.key, effect: buff.effect, hit: false
    });
    if (buff.mult >= 2) beep(520 + buff.mult * 60, 0.04, 'triangle', 0.015);
  }
  updateBullets(dt);

  // 怪物攻擊
  monster.shootT -= dt;
  if (monster.shootT <= 0) {
    monster.shootT = Math.max(0.75, 1.55 - waveIdx * 0.1);
    monster.shots++;
    const spd = 195 + waveIdx * 12;
    const aim = Math.atan2(PLAYER_Y - monster.y, player.x - monster.x);
    const fan = monster.shots % 3 === 0 ? [-0.3, 0, 0.3] : [0];
    fan.forEach(o => orbs.push({ x: monster.x, y: monster.y + 30, vx: Math.cos(aim + o) * spd, vy: Math.sin(aim + o) * spd, r: 9 }));
  }
  orbs.forEach(o => {
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (Math.hypot(o.x - player.x, o.y - PLAYER_Y) < o.r + 13) { o.dead = true; hurtPlayer(); }
    if (o.y > H + 20 || o.x < -20 || o.x > W + 20) o.dead = true;
  });
  orbs = orbs.filter(o => !o.dead);
  if (phase === 'over') return;

  // 神門
  if (gateRow) {
    gateRow.y += GATE_SPEED * dt;
    if (!gateRow.resolved && gateRow.y >= PLAYER_Y - 24) {
      const lane = clamp(Math.floor(player.x / (W / 3)), 0, 2);
      gateRow.lane = lane;
      gateRow.success = onGateCollision(gateRow.gates[lane]);
      gateRow.resolved = true;
      gateTimer = 7.5;
    }
    if (gateRow.y > H + 80) gateRow = null;
  } else {
    gateTimer -= dt;
    if (gateTimer <= 0) {
      gateRow = { y: GATE_SPAWN_Y, gates: MythGameEngine.generateGates(monster.def, 3), resolved: false, lane: -1, success: false };
    }
  }

  // 擊殺判定
  if (monster.hp <= 0) {
    monster.hp = 0;
    phase = 'kill'; phaseT = 2.6;
    sfx.kill();
    burst(monster.x, monster.y, '#ffd86b', 90, 380);
    burst(monster.x, monster.y, '#ff6a2a', 60, 300);
    rings.push({ x: monster.x, y: monster.y, r: 10, max: 220, life: 0.8, t: 0, color: '#ffd86b' });
    score += 500 + lives * 100;
    stats.encounters[stats.encounters.length - 1].outcome = 'win';
    orbs = [];
    showMsg(`討伐成功！${monster.def.name} 已被收服。 +${500 + lives * 100} 分`, '#ffd86b', 2.6);
  }
}

function updateBullets(dt) {
  bullets.forEach(b => {
    if (b.effect === 'homing' && phase === 'fight') {
      const dx = monster.x - b.x, dy = monster.y - b.y;
      const dist = Math.hypot(dx, dy) || 1;
      const sp = Math.hypot(b.vx, b.vy) || BASE_BULLET_SPEED;
      b.vx += (dx / dist * sp - b.vx) * Math.min(1, dt * 6);
      b.vy += (dy / dist * sp - b.vy) * Math.min(1, dt * 6);
      const n = Math.hypot(b.vx, b.vy); b.vx = b.vx / n * sp; b.vy = b.vy / n * sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;

    // 貫穿：清除路徑上的敵彈
    if (b.effect === 'pierce') orbs.forEach(o => { if (Math.hypot(o.x - b.x, o.y - b.y) < o.r + 8) { o.dead = true; burst(o.x, o.y, '#44b0ff', 6, 100); } });

    if (!b.hit && phase === 'fight' && Math.hypot(b.x - monster.x, b.y - monster.y) < 56) {
      b.hit = true;
      sfx.hit();
      dealDamage(b.dmg, b.x, b.y);
      burst(b.x, b.y, BULLET_STYLE[b.key].color, 5, 140);
      if (b.effect === 'chain') {
        makeBolt(b.x, b.y, monster.x + rand(-40, 40), monster.y + rand(-30, 30), '#b07aff');
        dealDamage(b.dmg * 0.3, monster.x, monster.y + 20);
      } else if (b.effect === 'aoe') {
        rings.push({ x: b.x, y: b.y, r: 4, max: 80, life: 0.35, t: 0, color: '#ffd93b' });
        orbs.forEach(o => { if (Math.hypot(o.x - b.x, o.y - b.y) < 90) { o.dead = true; burst(o.x, o.y, '#ffd93b', 8, 120); } });
        dealDamage(b.dmg * 0.2, b.x, b.y + 10);
      } else if (b.effect === 'melt') {
        monster.melt = 2.5;
      }
      if (b.effect !== 'pierce') b.dead = true;
    }
    if (b.y < -30 || b.x < -30 || b.x > W + 30) b.dead = true;
  });
  orbs = orbs.filter(o => !o.dead);
  bullets = bullets.filter(b => !b.dead);
}

// ====================== 11. 繪製 ======================
function drawBullet(b) {
  const s = BULLET_STYLE[b.key];
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(Math.atan2(b.vx, -b.vy));
  ctx.shadowColor = s.glow; ctx.shadowBlur = 14;
  ctx.fillStyle = s.color; ctx.strokeStyle = s.color; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  switch (s.shape) {
    case 'trident':
      ctx.beginPath();
      ctx.moveTo(0, 11); ctx.lineTo(0, -11);
      ctx.moveTo(-6, -3); ctx.lineTo(-6, -13);
      ctx.moveTo(6, -3); ctx.lineTo(6, -13);
      ctx.moveTo(-6, -3); ctx.lineTo(6, -3);
      ctx.stroke(); break;
    case 'chain':
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(0, i * 8, 4, 0, 6.3); ctx.stroke(); }
      break;
    case 'spear':
      ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(5, -4); ctx.lineTo(2, 13); ctx.lineTo(-2, 13); ctx.lineTo(-5, -4); ctx.closePath(); ctx.fill(); break;
    case 'arrow':
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, -12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(5, -8); ctx.lineTo(-5, -8); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(-4, 19); ctx.moveTo(0, 14); ctx.lineTo(4, 19); ctx.stroke(); break;
    case 'sun':
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, 6.3); ctx.fill();
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 + time * 6;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * 8, Math.sin(a) * 8); ctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); ctx.stroke();
      }
      break;
    case 'lava':
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, 6.3); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#7a1500';
      ctx.beginPath(); ctx.arc(1, 1, 3.5, 0, 6.3); ctx.fill(); break;
    default:
      rr(-3, -9, 6, 18, 3); ctx.fill();
  }
  ctx.restore();
}

function drawGates() {
  if (!gateRow) return;
  const laneW = W / 3;
  const playerLane = clamp(Math.floor(player.x / laneW), 0, 2);
  gateRow.gates.forEach((g, i) => {
    const x = i * laneW + 8, w = laneW - 16, y = gateRow.y - GATE_H / 2;
    const col = deityColor(g.deity);
    let alpha = 1;
    if (gateRow.resolved) alpha = i === gateRow.lane ? 1 : 0.22;
    ctx.save();
    ctx.globalAlpha = alpha;
    const under = !gateRow.resolved && i === playerLane;
    rr(x, y, w, GATE_H, 14);
    ctx.fillStyle = under ? 'rgba(255,255,255,0.16)' : 'rgba(20,24,48,0.82)';
    ctx.fill();
    ctx.shadowColor = col; ctx.shadowBlur = under ? 22 : 10;
    ctx.lineWidth = under ? 4 : 2.5;
    ctx.strokeStyle = gateRow.resolved && i === gateRow.lane ? (gateRow.success ? '#00ff66' : '#ff4444') : col;
    ctx.stroke();
    ctx.shadowBlur = 0;
    txt(g.deity.symbol, x + w / 2, y + 24, 30, '#fff');
    txt(g.deity.name, x + w / 2, y + 50, g.deity.name.length > 4 ? 15 : 17, '#fff', 'center', true);
    txt(g.deity.domain, x + w / 2, y + 72, 11, col);
    txt(g.deity.weaponName, x + w / 2, y + 90, 10.5, 'rgba(255,255,255,0.65)');
    ctx.restore();
  });
}

function drawMonster() {
  const look = MONSTER_LOOK[monster.def.id];
  const mx = monster.x, my = monster.y;
  // 中性紅色氣場（不洩漏答案）
  const g = ctx.createRadialGradient(mx, my, 10, mx, my, 100);
  g.addColorStop(0, 'rgba(255,60,60,0.28)'); g.addColorStop(1, 'rgba(255,60,60,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 100, 0, 6.3); ctx.fill();
  if (monster.melt > 0) {
    ctx.fillStyle = 'rgba(255,106,42,0.25)'; ctx.beginPath(); ctx.arc(mx, my, 62, 0, 6.3); ctx.fill();
  }
  ctx.save();
  if (phase === 'kill') ctx.globalAlpha = Math.max(0, phaseT / 2.6);
  if (monster.flash > 0) ctx.filter = 'brightness(2.2)';
  txt(look.emoji, mx, my, look.size, '#fff');
  ctx.restore();
  ctx.filter = 'none';

  // 名稱與領域
  txt(monster.def.name, W / 2, 258, 17, '#fff', 'center', true);
  txt(`威脅領域：${monster.def.domainCategory}`, W / 2, 279, 13, '#ff9f9f');
  // 血條
  const bw = 320, bx = (W - bw) / 2, by = 126;
  rr(bx, by, bw, 12, 6); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
  const pct = clamp(monster.hp / monster.maxHp, 0, 1);
  if (pct > 0) {
    rr(bx, by, bw * pct, 12, 6);
    const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    hg.addColorStop(0, '#ff3b3b'); hg.addColorStop(1, '#ff9a4a');
    ctx.fillStyle = hg; ctx.fill();
  }
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.4)'; rr(bx, by, bw, 12, 6); ctx.stroke();
  txt(`${Math.ceil(monster.hp)} / ${monster.maxHp}`, W / 2, by + 6.5, 10, '#fff');
}

function drawPlayer() {
  if (player.inv > 0 && Math.floor(time * 20) % 2 === 0) return;
  const x = player.x, y = PLAYER_Y;
  ctx.save();
  ctx.shadowColor = buff.color; ctx.shadowBlur = 16;
  ctx.fillStyle = '#e9d9a6';
  ctx.beginPath(); ctx.moveTo(x, y - 24); ctx.lineTo(x + 17, y + 16); ctx.lineTo(x, y + 8); ctx.lineTo(x - 17, y + 16); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = buff.color;
  ctx.beginPath(); ctx.arc(x, y - 2, 5, 0, 6.3); ctx.fill();
  ctx.restore();
  if (player.shield > 0) {
    ctx.strokeStyle = 'rgba(241,210,122,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 30 + Math.sin(time * 6) * 1.5, 0, 6.3); ctx.stroke();
  }
}

function drawHUD() {
  // 頂部資訊列
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, 40);
  txt(`第 ${waveIdx + 1}/${order.length} 波`, 12, 20, 15, '#fff', 'left', true);
  txt(`分數 ${score}`, 110, 20, 15, '#ffd86b', 'left', true);
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts += i < lives ? '♥' : '♡';
  txt(hearts, W - 12, 20, 22, '#ff5a6a', 'right', true);

  // 訊息橫幅（滑動顯示，不暫停遊戲）
  if (msg) {
    const font = `bold 14px ${FONT}`;
    const lines = wrapLines(msg.text, W - 44, font);
    const bh = lines.length * 20 + 14;
    const slide = Math.min(1, msg.t / 0.25);
    const fade = clamp((msg.dur - msg.t) / 0.4, 0, 1);
    const off = (1 - (1 - Math.pow(1 - slide, 3))) * -bh;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(0, 44 + off);
    rr(10, 0, W - 20, bh, 10);
    ctx.fillStyle = 'rgba(8,10,24,0.88)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = msg.color; ctx.stroke();

    ctx.restore();

  const eff = EFFECT_NAME[buff.effect];
  ctx.fillStyle = buff.color; ctx.beginPath(); ctx.arc(16, H - 32, 6, 0, 6.3); ctx.fill();
  txt(`${buff.name} ×${buff.mult.toFixed(1)}${buff.effect !== 'none' ? ' ・' + eff : ''}`, 28, H - 32, 13, '#fff', 'left', true);
  if (phase === 'fight' && !gateRow && gateTimer > 0) txt(`下一批神門 ${Math.ceil(gateTimer)}s`, W - 12, H - 32, 12, '#9fb0ff', 'right');

}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0c1e'); g.addColorStop(0.5, '#121634'); g.addColorStop(1, '#1b1840');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  stars.forEach(s => {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * 2 + s.p);
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s);
  });
  ctx.globalAlpha = 1;
  // 神殿立柱剪影
  ctx.fillStyle = 'rgba(255,255,255,0.025)';
  for (let i = 0; i < 4; i++) { ctx.fillRect(14 + i * 6 , 300, 3, 440); ctx.fillRect(W - 28 - i * 6, 300, 3, 440); }
  // 通道分隔線
  if (phase !== 'title') {
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.setLineDash([8, 10]); ctx.lineWidth = 1;
    [W / 3, W * 2 / 3].forEach(x => { ctx.beginPath(); ctx.moveTo(x, 290); ctx.lineTo(x, H - 50); ctx.stroke(); });
    ctx.setLineDash([]);
    if (gateRow && !gateRow.resolved && player) {
      const lane = clamp(Math.floor(player.x / (W / 3)), 0, 2);
      ctx.fillStyle = 'rgba(255,255,255,0.045)';
      ctx.fillRect(lane * W / 3, 290, W / 3, H - 340);
    }
  }
}

function drawEffects() {
  rings.forEach(r => {
    ctx.globalAlpha = 1 - r.t / r.life; ctx.strokeStyle = r.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.3); ctx.stroke();
  });
  bolts.forEach(b => {
    ctx.globalAlpha = b.life / 0.25; ctx.strokeStyle = b.color; ctx.lineWidth = 3; ctx.shadowColor = b.color; ctx.shadowBlur = 10;
    ctx.beginPath(); b.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    ctx.shadowBlur = 0;
  });
  ctx.globalAlpha = 1;
  particles.forEach(p => {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
  floaters.forEach(f => { ctx.globalAlpha = clamp(f.life / 0.6, 0, 1); txt(f.text, f.x, f.y, 13, f.color, 'center', true); });
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * 8 * Math.min(1, shake * 3), rand(-1, 1) * 8 * Math.min(1, shake * 3));
  drawBackground();
  if (phase !== 'title') {
    drawMonster();
    drawGates();
    orbs.forEach(o => {
      ctx.save(); ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff5470'; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#ffd0d8'; ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.4, 0, 6.3); ctx.fill();
      ctx.restore();
    });
    bullets.forEach(drawBullet);
    if (phase !== 'over' && phase !== 'win') drawPlayer();
    drawEffects();
    drawHUD();
  }
  drawOverlays();
  ctx.restore();
}

// ====================== 12. 輸入 ======================
function startGame() { initAudio(); sfx.start(); newGame(); }
function tryStart() {
  if (phase === 'title') startGame();   // 結算後由面板上的「再玩一次」按鈕重開
}
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;   // 輸入暱稱時不要觸發遊戲按鍵
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); tryStart(); }
  else if (k === 'p' || k === 'P') { if (phase !== 'title' && phase !== 'over' && phase !== 'win') paused = !paused; }
  else if (k === 'm' || k === 'M') { muted = !muted; }
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});
function pointerX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) * (W / r.width);
}
canvas.addEventListener('pointermove', e => { targetX = pointerX(e); });
canvas.addEventListener('pointerdown', e => { targetX = pointerX(e); tryStart(); });
addEventListener('blur', () => { keys.left = keys.right = false; });

const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;   // 一律用 textContent，暱稱不會被當成 HTML
  return e;
}

const LB_LOCAL_KEY = 'mythGate_lb_v1', NICK_KEY = 'mythGate_nick';
const lb = { rows: [], status: LEADERBOARD_URL ? 'loading' : 'local', mine: null, rank: null, err: '' };
const cmpRows = (a, b) => (b.score - a.score) || (b.waves - a.waves) || (a.time - b.time);

function localRows() {
  try { const r = JSON.parse(localStorage.getItem(LB_LOCAL_KEY) || '[]'); return Array.isArray(r) ? r : []; }
  catch (e) { return []; }
}
function saveLocalRow(row) {
  try {
    const rows = localRows(); rows.push(row); rows.sort(cmpRows);
    localStorage.setItem(LB_LOCAL_KEY, JSON.stringify(rows.slice(0, 50)));
  } catch (e) {}
}
async function fetchJSON(url, opts, ms = 9000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { ...opts, signal: ctl.signal }); return await r.json(); }
  finally { clearTimeout(t); }
}

async function loadLeaderboard() {
  lb.rows = localRows().sort(cmpRows).slice(0, 10);
  lb.status = LEADERBOARD_URL ? 'loading' : 'local';
  refreshLbUI();
  if (!LEADERBOARD_URL) return;
  try {
    const data = await fetchJSON(LEADERBOARD_URL + (LEADERBOARD_URL.includes('?') ? '&' : '?') + 'action=top');
    if (stats && stats.submitted) return;   // 已送分就不要用舊資料覆蓋
    if (data && data.ok && Array.isArray(data.rows)) { lb.rows = data.rows; lb.status = 'online'; }
    else throw new Error('bad_response');
  } catch (e) {
    if (stats && stats.submitted) return;
    lb.status = 'offline';
  }
  refreshLbUI();
}

function refreshLbUI() {
  const statusText = {
    loading: '排行榜載入中…', online: '', local: '本機排行榜（尚未設定線上排行榜）',
    offline: '線上排行榜連不上，顯示本機紀錄', submitting: '送出分數中…',
    rejected: '線上排行榜沒有收下這筆分數（' + lb.err + '），已存在本機'
  };
  $('lbStatus').textContent = statusText[lb.status] || '';
  $('lbRank').textContent = lb.rank ? `你的名次：第 ${lb.rank} 名${lb.status === 'online' ? '' : '（本機）'}` : '';
  const ol = $('lbList'); ol.innerHTML = '';
  if (!lb.rows.length) { ol.append(el('li', '', '尚無紀錄，成為第一位英雄！')); return; }
  lb.rows.slice(0, 10).forEach((r, i) => {
    const mine = lb.mine && r.ts === lb.mine.ts && r.name === lb.mine.name;
    const li = el('li', mine ? 'me' : '');
    li.append(el('span', 'rk', String(i + 1)), el('span', 'nm', r.name), el('span', 'sc', String(r.score)), el('span', 'wv', `${r.waves}/6`));
    ol.append(li);
  });
}

// ---- 結算 ----
function endRun(win) {
  phase = win ? 'win' : 'over';
  overT = 0; msg = null; orbs = []; keys.left = keys.right = false;
  const enc = stats.encounters[stats.encounters.length - 1];
  if (!win && enc) enc.outcome = 'lose';
  const total = stats.right + stats.wrong;
  stats.bonus = 0;
  if (win) {
    stats.bonus = Math.round((total ? stats.right / total : 0) * 1000);   // 準確率獎勵
    score += stats.bonus;
    sfx.kill();
  }
  showEndPanel();
}

function showEndPanel() {
  const win = phase === 'win';
  const total = stats.right + stats.wrong;
  const waves = stats.encounters.filter(e => e.outcome === 'win').length;
  $('uiTitle').textContent = win ? '試煉通過！' : '試煉失敗';
  $('uiTitle').style.color = win ? '#ffd86b' : '#ff5a6a';
  $('uiSub').textContent = `得分 ${score}　通過 ${waves}/${order.length} 波　準確率 ${total ? Math.round(stats.right / total * 100) : 0}%` +
    (win ? `　（準確率獎勵 +${stats.bonus}）` : '');
  let nick = '';
  try { nick = localStorage.getItem(NICK_KEY) || ''; } catch (e) {}
  $('nick').value = nick; $('nick').disabled = false; $('submitBtn').disabled = false;
  $('submitRow').hidden = false;
  lb.mine = null; lb.rank = null;
  buildStatsTab(); buildDexTab();
  selectTab('lb');
  $('ui').hidden = false;
  loadLeaderboard();
}
function hideEndPanel() { $('ui').hidden = true; }

function selectTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  ['lb', 'stats', 'dex'].forEach(t => { $('tab-' + t).hidden = t !== name; });
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => selectTab(b.dataset.tab)));
$('again').addEventListener('click', () => startGame());
$('submitBtn').addEventListener('click', () => submitScore());
$('nick').addEventListener('keydown', e => { if (e.key === 'Enter') submitScore(); });

async function submitScore() {
  if (!stats || stats.submitted) return;
  stats.submitted = true;
  $('submitBtn').disabled = true; $('nick').disabled = true;
  const name = ($('nick').value || '').trim().slice(0, 12) || '無名英雄';
  try { localStorage.setItem(NICK_KEY, name); } catch (e) {}
  const waves = stats.encounters.filter(e => e.outcome === 'win').length;
  const row = {
    name, score, waves, time: Math.round(stats.runTime), right: stats.right, wrong: stats.wrong,
    win: phase === 'win', ts: Date.now(), elapsed: Math.round((Date.now() - stats.startWall) / 1000)
  };
  lb.mine = { name, ts: row.ts };
  saveLocalRow(row);
  const local = localRows().sort(cmpRows);
  lb.rank = local.findIndex(r => r.ts === row.ts && r.name === name) + 1;
  lb.rows = local.slice(0, 10);
  lb.status = LEADERBOARD_URL ? 'submitting' : 'local';
  refreshLbUI();
  if (LEADERBOARD_URL) {
    try {
      // 用 text/plain 送出，避免瀏覽器的跨網域預檢（GAS 不支援 OPTIONS）
      const data = await fetchJSON(LEADERBOARD_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(row), redirect: 'follow'
      });
      if (data && data.ok) { lb.rows = data.rows || lb.rows; lb.rank = data.rank || null; lb.status = 'online'; }
      else { lb.status = 'rejected'; lb.err = (data && data.error) || 'unknown'; }
    } catch (e) { lb.status = 'offline'; }
  }
  $('submitRow').hidden = true;
  refreshLbUI();
}

function buildStatsTab() {
  const box = $('tab-stats'); box.innerHTML = '';
  const total = stats.right + stats.wrong;
  box.append(el('p', '', `選門正確 ${stats.right} 次　錯誤 ${stats.wrong} 次`));
  box.append(el('p', '', `踩中混淆陷阱 ${stats.mis} 次　準確率 ${total ? Math.round(stats.right / total * 100) : 0}%`));
  const best = Object.entries(stats.mastered).sort((a, b) => b[1] - a[1])[0];
  box.append(el('p', 'good', best ? `最常答對：${DEITIES[best[0]].name}（${best[1]} 次）` : '最常答對：—'));
  const rv = Object.entries(stats.review).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (rv.length) {
    box.append(el('h3', '', '需要複習的神祇'));
    rv.forEach(([id, n]) => { const d = DEITIES[id]; box.append(el('p', 'bad', `${d.symbol} ${d.name}（${d.domain}）— 漏掉 ${n} 次`)); });
    box.append(el('h3', '', '常見誤選'));
    Object.entries(stats.pairs).sort((a, b) => b[1] - a[1]).slice(0, 3).forEach(([k, n]) => {
      const [mid, did] = k.split('|');
      const m = MONSTER_ROSTER.find(x => x.id === mid);
      box.append(el('p', 'bad', `${m.name}：誤選${DEITIES[did].name}（應為${DEITIES[m.rulingDeityId].name}）×${n}`));
    });
  } else if (total) box.append(el('p', 'good', '全部答對，沒有需要複習的神祇！'));
  else box.append(el('p', '', '這局還沒選過門。'));
}

function buildDexTab() {

  box.append(el('p', 'hint', '點開怪物，查看牠背後的神話典故與你的選擇。'));
  stats.encounters.forEach(enc => {
    const m = MONSTER_ROSTER.find(x => x.id === enc.monsterId);
    const lore = MONSTER_LORE[m.id];
    const det = el('details', 'dex');
    const sum = el('summary', '');
    sum.append(el('span', 'ico', lore.icon), el('span', 'mn', m.name),
      el('span', 'badge ' + (enc.outcome === 'win' ? 'win' : 'lose'), enc.outcome === 'win' ? '討伐' : '害你喪命'));
    det.append(sum);
    det.append(el('p', 'story', lore.story));
    if (lore.note) det.append(el('p', 'note', lore.note));
    const correct = DEITIES[m.rulingDeityId];
    det.append(el('p', 'key', `正解神祇：${correct.symbol} ${correct.name}（${correct.domain}）`));
    if (enc.right + enc.wrong === 0) det.append(el('p', '', '你還沒來得及選門就倒下了。'));
    else {
      det.append(el('p', '', `你的選門：正確 ${enc.right} 次、錯誤 ${enc.wrong} 次`));
      [...new Set(enc.chosen)].forEach(id => {
        const line = REBUKE_DIALOGUES[id]?.[m.rulingDeityId];
        det.append(el('p', 'bad', `誤選 ${DEITIES[id].name}${m.confusionDeityIds.includes(id) ? '（踩中混淆陷阱）' : ''}${line ? '　' + line : ''}`));
      });
    }
    box.append(det);
  });
}

loadLeaderboard();

// ====================== 14. 主迴圈 ======================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
